name: Morning matchups

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-matchups
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TZ: America/Chicago
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v5
        with:
          path: |
            cache
            state
          key: matchup-data-${{ github.run_id }}
          restore-keys: |
            matchup-data-
      - name: Run the bot
        run: python matchup_bot.py --scheduled
      - if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            cache
            state
          key: matchup-data-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date +%d)" = "01" ]; then
            git config user.name "matchup-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date > keepalive.txt
            git add keepalive.txt
            git commit -m "Monthly keep-alive" && git push || true
          fi
